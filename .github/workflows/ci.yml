# What every push has to satisfy. Kept cheap on purpose: this repository is
# intentionally small; the expensive campaigns live in deep.yml where they run
# on a schedule instead of on every commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build matrix exists because it has already caught something: the
  # external-proxy harness used Setpgid, Getpgid and Kill directly and did not
  # compile for Windows at all, on a tree whose tests were entirely green.
  # Nothing but a cross-build finds that.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
      - name: Gosec reviewed baseline
        run: |
          set +e
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
            -fmt json -out gosec.json ./...
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 0 || test "$scanner_status" -eq 1
          ./scripts/check_gosec.py gosec.json .

  # Run the portable suite on every advertised native OS and architecture.
  # -short skips the tests that bring QUIC up across an emulated 300 ms
  # erasure path. Those run natively in deep.yml and release-candidate.yml.
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -short -timeout 20m ./...
      - name: live probe helper tests
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  mobile-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - run: mobile/scripts/audit-dependencies.sh
      - run: go test ./mobile/tools/notices
      - run: go test -race ./...
        working-directory: mobile/core
      - run: go vet ./...
        working-directory: mobile/core
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
        working-directory: mobile/core
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...
        working-directory: mobile/core
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: mobile/core
      - name: notices are reproducible
        run: |
          go run ./mobile/tools/notices \
            -core mobile/core \
            -lock mobile/runtime-dependencies.lock \
            -output mobile/legal/THIRD_PARTY_NOTICES.txt
          git diff --exit-code -- mobile/legal/THIRD_PARTY_NOTICES.txt

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
      - name: install pinned Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.0.12433566"
      - run: mobile/scripts/build-android-core.sh
      - name: lint, shrink, and package
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          lintDebug lintRelease
          assembleDebug assembleDebugAndroidTest
          assembleRelease bundleRelease

  android-instrumentation:
    name: Android Keystore API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
      - name: install official Android emulator image
        run: >-
          sdkmanager
          "platforms;android-37" "build-tools;36.0.0" "ndk;28.0.12433566"
          "emulator" "platform-tools"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - run: mobile/scripts/build-android-core.sh
      - name: assemble app and instrumentation APKs
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          assembleDebug assembleDebugAndroidTest
      - name: start isolated emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          printf 'no\n' | avdmanager create avd --force \
            --name queqiao_ci \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" \
            --device pixel_6
          nohup emulator @queqiao_ci -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/queqiao-emulator.log" 2>&1 &
          adb wait-for-device
          for _ in {1..90}; do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/queqiao-emulator.log"
          exit 1
      - name: run mobile storage and routing checks
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          connectedDebugAndroidTest

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - run: mobile/scripts/build-ios-core.sh
      - run: ../scripts/run-swiftlint.sh lint --strict --config .swiftlint.yml .
        working-directory: mobile/ios
      - name: simulator build and boundary tests
        working-directory: mobile/ios
        run: >-
          xcodebuild
          -project Queqiao.xcodeproj
          -scheme Queqiao
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          test

  # Exercise the actual release path, including embedded version metadata and
  # deterministic archive creation. One target is enough here; release.yml
  # packages the complete six-target matrix.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: package smoke test
        run: |
          build_date=$(git show -s --format=%cI HEAD)
          go run ./cmd/queqiaopack \
            --version v0.0.0-ci --commit "${GITHUB_SHA}" \
            --build-date "$build_date" --targets linux/amd64 \
            --output dist
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          ./scripts/validate_release.py dist
          cd dist
          tar -xzf queqiaod_v0.0.0-ci_linux_amd64.tar.gz
          ./queqiaod_v0.0.0-ci_linux_amd64/queqiaod --version |
            grep -F "queqiaod v0.0.0-ci commit=${GITHUB_SHA}"
