# What every push has to satisfy. Kept cheap on purpose: this repository is
# intentionally small; the expensive campaigns live in deep.yml where they run
# on a schedule instead of on every commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build matrix exists because it has already caught something: the
  # external-proxy harness used Setpgid, Getpgid and Kill directly and did not
  # compile for Windows at all, on a tree whose tests were entirely green.
  # Nothing but a cross-build finds that.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
      - name: Gosec reviewed baseline
        run: |
          set +e
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
            -fmt json -out gosec.json ./...
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 0 || test "$scanner_status" -eq 1
          ./scripts/check_gosec.py gosec.json .

  # -short skips the tests that bring QUIC up across an emulated 300 ms
  # erasure path. Those are the slowest and the most timing-dependent, and a
  # two-core hosted runner is the worst place to judge them; deep.yml runs
  # them in full.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -short -timeout 20m ./...
      - name: live probe helper tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: credential generator smoke test
        run: ./scripts/test_generate_credentials.sh

  # Exercise the actual release path, including embedded version metadata and
  # deterministic archive creation. One target is enough here; release.yml
  # packages the complete six-target matrix.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: package smoke test
        run: |
          build_date=$(git show -s --format=%cI HEAD)
          go run ./cmd/queqiaopack \
            --version v0.0.0-ci --commit "${GITHUB_SHA}" \
            --build-date "$build_date" --targets linux/amd64 \
            --output dist
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          ./scripts/validate_release.py dist
          cd dist
          tar -xzf queqiaod_v0.0.0-ci_linux_amd64.tar.gz
          ./queqiaod_v0.0.0-ci_linux_amd64/queqiaod --version |
            grep -F "queqiaod v0.0.0-ci commit=${GITHUB_SHA}"
